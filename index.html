<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💖</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff4e88, #ff9ecf);
        font-family: 'Segoe UI', sans-serif;
        overflow: hidden;
        text-align: center;
        color: white;
    }

    .container {
        position: relative;
        z-index: 2;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 30px;
    }

    .buttons {
        position: relative;
        height: 200px;
    }

    button {
        padding: 15px 40px;
        font-size: 1.2rem;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: 0.2s ease;
        position: absolute;
    }

    #yesBtn {
        background-color: #fff;
        color: #ff4e88;
        left: 30%;
    }

    #noBtn {
        background-color: #ff1744;
        color: white;
        left: 55%;
    }

    .message {
        font-size: 2rem;
        margin-top: 20px;
        display: none;
        animation: pop 0.5s ease forwards;
    }

    @keyframes pop {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }

    /* Floating Hearts */
    .heart {
        position: fixed;
        bottom: -10px;
        font-size: 20px;
        animation: floatUp linear forwards;
        opacity: 0.8;
        z-index: 1;
    }

    @keyframes floatUp {
        to {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }

    .music-btn {
        margin-top: 20px;
        padding: 8px 20px;
        border-radius: 20px;
        border: none;
        background: white;
        color: #ff4e88;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Will You Be My Valentine? ❤️</h1>
    <div class="buttons">
        <button id="yesBtn">YES 💖</button>
        <button id="noBtn">NO 😢</button>
    </div>
    <div class="message" id="loveMessage">
        YAY!!! I knew you'd say YES! 💕🥰
    </div>

    <button class="music-btn" onclick="playMusic()">🎵 Tap for Music</button>
</div>

<!-- Romantic Music -->
<audio id="bgMusic" loop>
    <!-- Replace this with any romantic mp3 link you like -->
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("loveMessage");
const music = document.getElementById("bgMusic");

yesBtn.addEventListener("click", () => {
    message.style.display = "block";
});

function playMusic() {
    music.play();
}

document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
    );

    if (distance < 100) {
        const randomX = Math.random() * (window.innerWidth - rect.width);
        const randomY = Math.random() * (window.innerHeight - rect.height);

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
    }
});

/* Floating Hearts Generator */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
