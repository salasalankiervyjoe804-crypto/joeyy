<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
/* Reset and body */
body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Segoe UI', cursive;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    color: white;
}

/* Main container */
.container {
    background: rgba(255, 0, 102, 0.8);
    padding: 30px 20px;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(255, 0, 102, 0.8);
    position: relative;
    z-index: 10;
    width: 90%;
    max-width: 400px;
    animation: fadeIn 2s ease-in-out;
}

/* Titles */
h1 {
    font-size: 2em;
    margin-bottom: 10px;
}

p {
    font-size: 1em;
    margin: 5px 0;
}

/* Buttons */
.buttons {
    margin-top: 20px;
    position: relative;
    height: 60px; /* Ensure space for moving No button */
}

button {
    padding: 12px 20px;
    font-size: 1em;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
    touch-action: manipulation; /* Mobile-friendly */
}

.yes {
    background-color: #ff004c;
    color: white;
}

.yes:hover {
    background-color: #ff1a66;
    transform: scale(1.1);
}

.no {
    background-color: white;
    color: #ff004c;
    position: absolute;
}

/* Animations */
@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.8);}
    to {opacity: 1; transform: scale(1);}
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -50px;
    color: #ff004c;
    font-size: 20px;
    animation: floatUp 8s linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-120vh) scale(1.5);
        opacity: 0;
    }
}

/* Responsive Text & Buttons */
@media (max-width: 480px) {
    h1 { font-size: 1.5em; }
    .yes, .no { font-size: 0.9em; padding: 10px 15px; }
    .buttons { height: 80px; }
}
</style>
</head>

<body>

<!-- Background Music -->
<audio autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/02/23/audio_5b5e3b14b7.mp3?filename=romantic-background-112191.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>💖 Will You Be My Valentine? 💖</h1>
    <p>February 14, 2026 | 1:00 PM</p>

    <div class="buttons">
        <button class="yes" onclick="sayYes()">Yes 💘</button>
        <button class="no" id="noBtn">No 💔</button>
    </div>

    <p id="response"></p>
</div>

<script>
// Floating Hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 5 + 5) + "s";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}
setInterval(createHeart, 300);

// Yes Button
function sayYes() {
    document.getElementById("response").innerHTML = 
        "YAY!!! 💍💖 I can't wait for our special date! 💕";
}

// No Button Moves Away on Hover / Touch
const noBtn = document.getElementById("noBtn");

function moveNoBtn() {
    const containerWidth = window.innerWidth - noBtn.offsetWidth;
    const containerHeight = window.innerHeight - noBtn.offsetHeight;
    const randomX = Math.random() * containerWidth;
    const randomY = Math.random() * containerHeight;
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

noBtn.addEventListener("mouseover", moveNoBtn);
noBtn.addEventListener("touchstart", moveNoBtn);
</script>

</body>
</html>
